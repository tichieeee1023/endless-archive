<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="종점 없는 서고">
  <rect width="512" height="512" fill="#252e35"/>
  <!-- Bookplate frame, intentionally outside the maskable safe area. -->
