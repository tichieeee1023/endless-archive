  <path d="M256 101 261 116 276 121 261 126 256 141 251 126 236 121 251 116Z" fill="#d8b986"/>
  <!-- Front of the last carriage, with two windows. -->
  <g stroke="#f4ebda" stroke-linejoin="round" stroke-linecap="round">
    <path d="M177 285V202Q177 175 200 163Q256 139 312 163Q335 175 335 202V285" fill="none" stroke-width="9"/>
