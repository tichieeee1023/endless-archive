    <path d="M256 337Q200 290 115 309L115 362Q195 345 256 393Q317 345 397 362L397 309Q312 290 256 337Z" fill="#f4ebda" stroke-width="5"/>
    <path d="M256 337V393" fill="none" stroke="#252e35" stroke-width="5"/>
    <path d="M133 329Q191 322 237 352M133 345Q190 338 237 369M379 329Q321 322 275 352M379 345Q322 338 275 369" fill="none" stroke="#252e35" stroke-width="3.5"/>
